<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Assista para continuar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="player" aria-label="Apresentação em vídeo">
    <video id="video" playsinline preload="metadata" disablepictureinpicture disableremoteplayback aria-label="Vídeo de apresentação"></video>
    <button id="cover" class="cover" type="button" aria-label="Assistir ao vídeo com som">
      <span class="play-icon" aria-hidden="true">▶</span>
      <span class="headline">Uma nova perspectiva.<br><em>O próximo passo é seu.</em></span>
      <span class="sound">◖)) &nbsp; Toque para assistir com som</span>
    </button>
    <button id="pause" class="pause" type="button" aria-label="Pausar vídeo" hidden>Ⅱ</button>
    <div class="bottom">
      <p id="status" role="status">Assista a 50% do vídeo para continuar</p>
      <div class="progress" role="progressbar" aria-label="Progresso do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div>
      <button id="continue" class="continue" disabled>Continuar <span aria-hidden="true">→</span></button>
      <span id="hint" class="hint">Seu próximo passo será liberado aqui</span>
    </div>
  </main>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
